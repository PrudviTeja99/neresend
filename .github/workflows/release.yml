name: Publish Multiplatform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Call Reusable Android Build
  # ==========================================
  build-android:
    name: Android Build Workflow
    uses: ./.github/workflows/android.yml

  # ==========================================
  # 2. Call Reusable Linux Build
  # ==========================================
  build-linux:
    name: Linux Build Workflow
    uses: ./.github/workflows/linux.yml

  # ==========================================
  # 3. Publish GitHub Release with Artifacts
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-android, build-linux]
    steps:
      - name: Checkout Code & Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Professional Release Changelog
        id: changelog
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}"
          echo "Generating release notes for tag: ${TAG_NAME}"
          python3 .github/scripts/generate_release_notes.py "${TAG_NAME}" release_notes.md

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeReSend-Android-APK
          path: release-assets

      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeReSend-Linux-AppImage
          path: release-assets

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeReSend-Linux-Tarball
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          name: NeReSend ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          body_path: release_notes.md
          files: |
            release-assets/NeReSend-Android.apk
            release-assets/NeReSend-x86_64.AppImage
            release-assets/NeReSend-Linux-x64.tar.gz
          draft: false
          prerelease: false
